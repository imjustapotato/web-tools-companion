<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Tools Companion</title>
    <link rel="stylesheet" href="./popup.css">
</head>

<body>

    <!-- Header Section -->
    <header id="header">
        <div class="header-icon-container">
            <img src="./logo128.png" alt="Web Tools Logo" class="header-icon">
        </div>
        <div class="header-content">
            <h1 class="header-title">Web Tools Companion</h1>
            <p class="header-subtitle">Developed by Kenn</p>
        </div>
        <button id="btn-reset-data" class="icon-btn" title="Reset All Extension Data">
            <iconify-icon icon="lucide:refresh-ccw" width="18"></iconify-icon>
        </button>
    </header>

    <!-- Primary Action -->
    <div class="mb-4">
        <button id="btn-open-tools" class="primary-action-btn">
            <iconify-icon icon="lucide:external-link" width="18"></iconify-icon>
            Open Schedule Visualizer
        </button>
    </div>

    <!-- Tool Ecosystem -->
    <div class="tool-list">
        
        <!-- Tool 1: Schedule Mapping -->
        <details class="tool-group" open>
            <summary class="tool-group-summary">
                <div class="summary-title-container">
                    <iconify-icon icon="lucide:calendar-days" class="summary-icon"></iconify-icon>
                    <span>Schedule Plotter</span>
                </div>
                <div style="display: flex; align-items: center;">
                    <div id="data-status-badge" class="status-badge hidden" style="margin-right: 0.75rem;">
                        <span class="badge-dot"></span>
                        <span class="badge-text">Saved</span>
                    </div>
                    <iconify-icon icon="lucide:chevron-down" class="summary-chevron"></iconify-icon>
                </div>
            </summary>

            <div class="tool-group-content">
                <div class="tool-group-inner">
                    
                    <button id="btn-auto-sched" class="tool-btn active-btn">
                        <div class="tool-btn-left">
                            <iconify-icon icon="lucide:zap" class="tool-btn-icon zap-icon"></iconify-icon>
                            <span class="tool-btn-text">Auto-Sync (FEU OSES)</span>
                        </div>
                        <iconify-icon id="auto-sched-icon" icon="ic:baseline-auto-awesome" class="auto-awesome-icon"></iconify-icon>
                    </button>

                    <button id="btn-extract-saf" class="tool-btn">
                        <div class="tool-btn-left">
                            <iconify-icon icon="lucide:file-text" class="tool-btn-icon"></iconify-icon>
                            <span>Extract from SAF</span>
                        </div>
                        <iconify-icon icon="lucide:download" class="tool-btn-icon"></iconify-icon>
                    </button>

                </div>
            </div>
        </details>

        <!-- Tool 2: Curriculum Mapping (WIP) -->
        <div class="tool-group disabled-btn">
            <div class="tool-group-summary">
                <div class="summary-title-container">
                    <iconify-icon icon="lucide:network" class="summary-icon" style="color: var(--text-muted)"></iconify-icon>
                    <span style="color: var(--text-secondary)">Curriculum Mapping</span>
                </div>
                <span class="wip-badge">COMING SOON</span>
            </div>
        </div>

        <!-- Developer / Activity Console -->
        <details class="tool-group">
            <summary class="tool-group-summary">
                <div class="summary-title-container">
                    <iconify-icon icon="lucide:terminal" class="summary-icon"></iconify-icon>
                    <span>Activity Log</span>
                </div>
                <iconify-icon icon="lucide:chevron-down" class="summary-chevron"></iconify-icon>
            </summary>

            <div class="tool-group-content">
                <div class="tool-group-inner">
                    <div id="console-output" class="console-window">
                        <div class="console-line">
                            <span class="console-time">[System]</span>
                            <span class="log-info">Console initialized. Awaiting logs...</span>
                        </div>
                    </div>
                    <div class="console-actions">
                        <button id="btn-clear-console" class="console-action-btn">Clear Log</button>
                    </div>
                </div>
            </div>
        </details>

    </div>

    <!-- Interactive Tooltip for Listen State -->
    <div id="mouse-tooltip" class="mouse-tooltip">
        Monitoring for schedule changes. Add or remove subjects to sync automatically!
    </div>

    <script type="module" src="./popup.ts"></script>
</body>

</html>
